<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Service Test Client</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 20px; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Email Service</h1>
    <p>Use this form to test if your backend is correctly sending emails.</p>
    
    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" value="Test User">
    </div>
    <div class="form-group">
        <label for="email">Sender Email:</label>
        <input type="email" id="email" value="test@example.com">
    </div>
    <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" rows="4">This is a test message sent from the secure backend.</textarea>
    </div>
    <button onclick="sendEmail()">Send Test Email</button>

    <div id="status"></div>

    <script>
        async function sendEmail() {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = 'Sending...';
            statusDiv.className = '';

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('https://localhost:5000/api/send-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.textContent = 'Success: ' + result.message;
                    statusDiv.className = 'success';
                } else {
                    statusDiv.textContent = 'Error: ' + (result.error || JSON.stringify(result.errors));
                    statusDiv.className = 'error';
                }
            } catch (error) {
                statusDiv.textContent = 'Network Error: ' + error.message + '. Make sure the server is running on https://localhost:5000';
                statusDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
